<svg width="860" height="220" viewBox="0 0 860 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="cb" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" x="0" y="0" fill="#1a2332"/>
      <rect width="24" height="24" x="24" y="0" fill="#111827"/>
      <rect width="24" height="24" x="0" y="24" fill="#111827"/>
      <rect width="24" height="24" x="24" y="24" fill="#1a2332"/>
    </pattern>
    <filter id="tg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="60%" stop-color="#FFF8DC"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="ov" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#0d1117" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.85"/>
    </linearGradient>
    <style>
      @keyframes fa { 0%,100%{transform:translateY(0);opacity:.4} 50%{transform:translateY(-12px);opacity:.65} }
      @keyframes fb { 0%,100%{transform:translateY(-7px);opacity:.3} 50%{transform:translateY(7px);opacity:.5} }
      @keyframes fc { 0%,100%{transform:translateY(0);opacity:.2} 50%{transform:translateY(-16px);opacity:.45} }
      @keyframes gs { 0%,100%{fill:#FFD700} 50%{fill:#FFFACD} }
      @keyframes bp { 0%,100%{opacity:.4} 50%{opacity:.9} }
      @keyframes kj {
        0%{transform:translate(0px,0px)}
        15%{transform:translate(0px,-22px)}
        35%{transform:translate(52px,-22px)}
        50%{transform:translate(52px,0px)}
        65%{transform:translate(52px,-18px)}
        80%{transform:translate(0px,-18px)}
        100%{transform:translate(0px,0px)}
      }
      .pa{animation:fa 3s ease-in-out infinite}
      .pb{animation:fb 4.2s ease-in-out infinite}
      .pc{animation:fc 3.7s ease-in-out infinite}
      .pd{animation:fa 5.1s ease-in-out infinite}
      .gn{animation:gs 2.8s ease-in-out infinite}
      .bd{animation:bp 2s ease-in-out infinite}
      .kn{animation:kj 5s ease-in-out infinite}
    </style>
  </defs>

  <!-- Chess board background -->
  <rect width="860" height="220" fill="url(#cb)"/>
  <!-- Dark overlay -->
  <rect width="860" height="220" fill="url(#ov)"/>

  <!-- Gold border top -->
  <rect class="bd" x="0" y="0" width="860" height="3" fill="url(#gg)"/>
  <line class="bd" x1="18" y1="13" x2="842" y2="13" stroke="#D4AF37" stroke-width="0.8" opacity="0.7"/>

  <!-- Left floating pieces -->
  <text class="pa" x="28" y="78" font-size="44" font-family="serif" fill="#D4AF37" text-anchor="middle">&#9820;</text>
  <text class="pb" x="76" y="158" font-size="34" font-family="serif" fill="#c8a442" text-anchor="middle">&#9821;</text>
  <text class="pc" x="118" y="52" font-size="27" font-family="serif" fill="#b89030" text-anchor="middle">&#9823;</text>
  <text class="pd" x="152" y="138" font-size="22" font-family="serif" fill="#a07828" text-anchor="middle">&#9817;</text>

  <!-- Right floating pieces -->
  <text class="pb" x="832" y="78" font-size="44" font-family="serif" fill="#D4AF37" text-anchor="middle">&#9819;</text>
  <text class="pa" x="784" y="158" font-size="34" font-family="serif" fill="#c8a442" text-anchor="middle">&#9822;</text>
  <text class="pd" x="742" y="52" font-size="27" font-family="serif" fill="#b89030" text-anchor="middle">&#9817;</text>
  <text class="pc" x="840" y="138" font-size="22" font-family="serif" fill="#a07828" text-anchor="middle">&#9818;</text>

  <!-- Animated knight -->
  <text class="kn" x="192" y="118" font-size="26" font-family="serif" fill="#D4AF37" text-anchor="middle" opacity="0.55">&#9822;</text>

  <!-- Name with gold glow -->
  <text x="430" y="100" font-size="50" font-family="Georgia,'Times New Roman',serif" font-weight="bold" text-anchor="middle" filter="url(#tg)">
    <tspan class="gn">Mai V&#x103;n L&#x1b0;&#x1ee3;ng</tspan>
  </text>

  <!-- Subtitle -->
  <text x="430" y="136" font-size="16" font-family="Georgia,serif" text-anchor="middle" fill="#e8d5b0" opacity="0.88">&#9823; Full-Stack Developer &#183; Java &#183; React &#9823;</text>

  <!-- Decorative underline -->
  <line x1="240" y1="147" x2="620" y2="147" stroke="url(#gg)" stroke-width="1" opacity="0.55"/>

  <!-- Bottom wave -->
  <path d="M0,182 Q140,162 280,176 Q430,192 580,174 Q720,158 860,178 L860,220 L0,220 Z" fill="#0d1117"/>

  <!-- Bottom border -->
  <line class="bd" x1="18" y1="208" x2="842" y2="208" stroke="#D4AF37" stroke-width="0.8" opacity="0.6"/>
</svg>
