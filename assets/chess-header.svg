<svg width="860" height="220" viewBox="0 0 860 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="cb" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" x="0" y="0" fill="#1a2332"/>
      <rect width="24" height="24" x="24" y="0" fill="#111827"/>
      <rect width="24" height="24" x="0" y="24" fill="#111827"/>
      <rect width="24" height="24" x="24" y="24" fill="#1a2332"/>
    </pattern>
    <filter id="tg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fl" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="60%" stop-color="#FFF8DC"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="ov" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#0d1117" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.85"/>
    </linearGradient>
    <style>
      @keyframes fa{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-12px);opacity:.65}}
      @keyframes fb{0%,100%{transform:translateY(-7px);opacity:.3}50%{transform:translateY(7px);opacity:.5}}
      @keyframes fc{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(-16px);opacity:.45}}
      @keyframes gs{0%,100%{fill:#FFD700}50%{fill:#FFFACD}}
      @keyframes bp{0%,100%{opacity:.4}50%{opacity:.9}}

      /* Knight makes 3 L-jumps, captures pawn, retreats — 9s loop */
      @keyframes kj{
        0%  {transform:translate(0,0);opacity:1}
        6%  {transform:translate(22px,-34px);opacity:1}
        12% {transform:translate(48px,0);opacity:1}
        18% {transform:translate(70px,-34px);opacity:1}
        24% {transform:translate(96px,0);opacity:1}
        30% {transform:translate(118px,-34px);opacity:1}
        35% {transform:translate(140px,0);opacity:1}
        52% {transform:translate(140px,0);opacity:1}
        58% {transform:translate(96px,-34px);opacity:1}
        63% {transform:translate(65px,0);opacity:1}
        69% {transform:translate(22px,-34px);opacity:1}
        74% {transform:translate(0,0);opacity:1}
        76% {transform:translate(0,0);opacity:0}
        79% {transform:translate(0,0);opacity:0}
        81% {transform:translate(0,0);opacity:1}
        100%{transform:translate(0,0);opacity:1}
      }
      /* Enemy pawn: stands still, gets captured at 35%, reappears at 81% */
      @keyframes ep{
        0%,33%{opacity:1;transform:translate(0,0)}
        37%  {opacity:0;transform:translate(0,-18px)}
        80%  {opacity:0;transform:translate(0,0)}
        82%  {opacity:1;transform:translate(0,0)}
        100% {opacity:1;transform:translate(0,0)}
      }
      /* Flash at capture moment */
      @keyframes cf{
        0%,33%{opacity:0}36%{opacity:1}42%{opacity:0}100%{opacity:0}
      }

      /* Right rook slides left then returns — 11s */
      @keyframes rp{
        0%,10%{transform:translateX(0)}
        38%  {transform:translateX(-130px)}
        60%  {transform:translateX(-130px)}
        88%  {transform:translateX(0)}
        100% {transform:translateX(0)}
      }
      /* Queen sweeps diagonally — 13s */
      @keyframes qs{
        0%,12% {transform:translate(0,0);opacity:.55}
        38%    {transform:translate(-75px,50px);opacity:.85}
        58%    {transform:translate(-75px,50px);opacity:.85}
        85%    {transform:translate(0,0);opacity:.55}
        100%   {transform:translate(0,0);opacity:.55}
      }
      /* Bishop dashes diagonally — 10s */
      @keyframes bd2{
        0%,18%  {transform:translate(0,0);opacity:.45}
        44%     {transform:translate(-58px,52px);opacity:.75}
        64%     {transform:translate(-58px,52px);opacity:.75}
        90%     {transform:translate(0,0);opacity:.45}
        100%    {transform:translate(0,0);opacity:.45}
      }
      /* Left rook counters — enemy from right-left, offset timing */
      @keyframes lr{
        0%,20%{transform:translateX(0);opacity:.35}
        50%  {transform:translateX(80px);opacity:.6}
        70%  {transform:translateX(80px);opacity:.6}
        95%  {transform:translateX(0);opacity:.35}
        100% {transform:translateX(0);opacity:.35}
      }

      .fa{animation:fa 3s ease-in-out infinite}
      .fb{animation:fb 4.2s ease-in-out infinite}
      .fc{animation:fc 3.7s ease-in-out infinite}
      .gn{animation:gs 2.8s ease-in-out infinite}
      .bd{animation:bp 2s ease-in-out infinite}
      .kn{animation:kj 9s ease-in-out infinite}
      .ep{animation:ep 9s ease-in-out infinite}
      .cf{animation:cf 9s ease-in-out infinite}
      .rp{animation:rp 11s ease-in-out infinite}
      .qs{animation:qs 13s ease-in-out infinite}
      .b2{animation:bd2 10s ease-in-out infinite}
      .lr{animation:lr 12s ease-in-out infinite}
    </style>
  </defs>

  <rect width="860" height="220" fill="url(#cb)"/>
  <rect width="860" height="220" fill="url(#ov)"/>

  <rect class="bd" x="0" y="0" width="860" height="3" fill="url(#gg)"/>
  <line class="bd" x1="18" y1="13" x2="842" y2="13" stroke="#D4AF37" stroke-width="0.8" opacity="0.7"/>

  <!-- LEFT SIDE: floating background -->
  <text class="fa" x="28" y="80"  font-size="42" font-family="serif" fill="#D4AF37" text-anchor="middle">&#9820;</text>
  <text class="fb" x="78" y="158" font-size="30" font-family="serif" fill="#c8a442" text-anchor="middle">&#9821;</text>
  <text class="fc" x="120" y="50" font-size="24" font-family="serif" fill="#b89030" text-anchor="middle">&#9817;</text>
  <!-- Left rook counter-charges from left -->
  <text class="lr" x="30" y="158" font-size="22" font-family="serif" fill="#8a7020" text-anchor="middle">&#9820;</text>

  <!-- BATTLE: white knight attacks gray pawn -->
  <text class="kn" x="48"  y="175" font-size="28" font-family="serif" fill="#FFD700" text-anchor="middle">&#9816;</text>
  <text class="ep" x="188" y="175" font-size="24" font-family="serif" fill="#777"    text-anchor="middle">&#9823;</text>
  <!-- Capture flash -->
  <circle class="cf" cx="188" cy="162" r="20" fill="#FFD700" filter="url(#fl)" opacity="0"/>

  <!-- RIGHT SIDE: rook patrol -->
  <text class="rp" x="828" y="78"  font-size="36" font-family="serif" fill="#D4AF37" text-anchor="middle">&#9820;</text>
  <!-- Queen sweeps diagonally -->
  <text class="qs" x="808" y="48"  font-size="40" font-family="serif" fill="#D4AF37" text-anchor="middle">&#9819;</text>
  <!-- Bishop dashes -->
  <text class="b2" x="845" y="145" font-size="28" font-family="serif" fill="#c8a442" text-anchor="middle">&#9821;</text>
  <!-- Floating knight right -->
  <text class="fa" x="750" y="162" font-size="26" font-family="serif" fill="#b89030" text-anchor="middle">&#9822;</text>
  <text class="fc" x="772" y="50"  font-size="20" font-family="serif" fill="#a07828" text-anchor="middle">&#9817;</text>

  <!-- CENTER: name -->
  <text x="430" y="100" font-size="50" font-family="Georgia,'Times New Roman',serif" font-weight="bold" text-anchor="middle" filter="url(#tg)">
    <tspan class="gn">Mai V&#x103;n L&#x1b0;&#x1ee3;ng</tspan>
  </text>
  <text x="430" y="136" font-size="16" font-family="Georgia,serif" text-anchor="middle" fill="#e8d5b0" opacity="0.88">&#9823; Full-Stack Developer &#183; Java &#183; React &#9823;</text>
  <line x1="240" y1="147" x2="620" y2="147" stroke="url(#gg)" stroke-width="1" opacity="0.55"/>

  <path d="M0,182 Q140,162 280,176 Q430,192 580,174 Q720,158 860,178 L860,220 L0,220 Z" fill="#0d1117"/>
  <line class="bd" x1="18" y1="208" x2="842" y2="208" stroke="#D4AF37" stroke-width="0.8" opacity="0.6"/>
</svg>
